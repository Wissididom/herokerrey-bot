name: Molt Update

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
            ~/.local/share/deno-wasmbuild
          key: deno-updater-herokerrey-bot
      - uses: actions/checkout@v4
      - name: Run updater
        id: updater
        run: |
          printf "Update deno dependencies\n\n" > updater-output.txt
          deno outdated --update >> updater-output.txt
          cat updater-output.txt
          echo "commit_message=$(cat updater-output.txt)" >> $GITHUB_OUTPUT
          rm updater-output.txt
      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: steps.updater.outputs.commit_message
          branch: deno-update
          delete-branch: true
          sign-commits: true
          title: Deno update
          body: steps.updater.outputs.commit_message
          labels: dependencies
